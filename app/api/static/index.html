<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PharmaAssist</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1c2230; --muted: #5b6474; --border: #d8dde4;
    --accent: #0f766e; --accent-text: #ffffff; --user: #e3f2ef; --chip: #eef1f5;
    --warn: #9a3412; --warn-bg: #fff3eb; --error: #b42318; --error-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151b; --panel: #19202a; --text: #e5e8ee; --muted: #98a2b1; --border: #2a333f;
      --accent: #2dd4bf; --accent-text: #062a26; --user: #15302c; --chip: #222b37;
      --warn: #fdba74; --warn-bg: #2b1d14; --error: #fca5a5; --error-bg: #2d1515;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
         background: var(--panel); }
  .msg.user { background: var(--user); margin-left: 15%; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-family: ui-monospace, Consolas, monospace;
          font-size: 12px; overflow-wrap: anywhere; }
  .chip.bad { color: var(--error); }
  .badge { display: inline-block; background: var(--warn-bg); color: var(--warn); border-radius: 6px;
           padding: 1px 8px; margin-right: 6px; font-size: 12px; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel);
         max-width: 860px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text);
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: wait; }
  @media (max-width: 600px) { .msg.user { margin-left: 0; } }
</style>
</head>
<body>
<header>
  <h1>PharmaAssist</h1>
  <p>Answers from the pharmacy's documents and read-only tracker data. Demo data only. Not medical advice.</p>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="2" maxlength="2000" placeholder="Ask about returns, storage, stock or expiring batches" required></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];
  const MAX_HISTORY = 10;
  const MAX_CHARS = 4000;

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function addMessage(role, text) {
    const box = el("div", "msg " + role);
    box.append(el("div", "text", text));
    log.append(box);
    log.scrollTop = log.scrollHeight;
    return box;
  }

  function addDetails(box, body) {
    const meta = el("div", "meta");
    if (body.guard) meta.append(el("span", "badge", "guard: " + body.guard));
    if (body.medical_refusal) meta.append(el("span", "badge", "medical refusal"));
    if (body.scope_refusal) meta.append(el("span", "badge", "out of scope"));
    if (body.citations.length) {
      meta.append(el("div", null, "Cited sources"));
      const chips = el("div", "chips");
      body.citations.forEach(c => chips.append(el("span", "chip", c)));
      meta.append(chips);
    }
    if (body.tool_calls.length) {
      meta.append(el("div", null, "Tracker and search calls"));
      const chips = el("div", "chips");
      body.tool_calls.forEach(t => {
        const label = t.name + "(" + JSON.stringify(t.arguments) + ")" + (t.ok ? " \u2192 " + t.rows : " \u2192 error");
        chips.append(el("span", t.ok ? "chip" : "chip bad", label));
      });
      meta.append(chips);
    }
    const seconds = body.latency_seconds == null ? "" : body.latency_seconds.toFixed(1) + " s";
    meta.append(el("div", null, [body.model, seconds].filter(Boolean).join(" \u00b7 ")));
    box.append(meta);
  }

  async function ask(message) {
    addMessage("user", message);
    const pending = addMessage("assistant", "Thinking\u2026");
    send.disabled = true;
    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message, history: history.slice(-MAX_HISTORY)}),
      });
      const body = await response.json();
      const text = pending.querySelector(".text");
      if (!response.ok) {
        const detail = typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail);
        text.textContent = "Error " + response.status + ": " + detail;
        pending.classList.add("error");
        return;
      }
      text.textContent = body.answer;
      addDetails(pending, body);
      history.push({role: "user", content: message.slice(0, MAX_CHARS)},
                   {role: "assistant", content: body.answer.slice(0, MAX_CHARS)});
    } catch (error) {
      pending.querySelector(".text").textContent = "Could not reach the service: " + error;
      pending.classList.add("error");
    } finally {
      send.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message || send.disabled) return;
    input.value = "";
    ask(message);
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
